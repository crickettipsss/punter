  50% { transform: translateY(-9px); }
}

.badge {

  text-decoration: none;
  font-size: 19px;
  font-weight: 800;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  box-shadow: 0 0 22px rgba(0,233,174,.12);
  animation: glow 2s ease-in-out infinite;
  transition: transform .2s;
}

.join-btn:active {
  transform: scale(.97);
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 12px rgba(0,233,174,.12); }
  50% { box-shadow: 0 0 24px rgba(0,233,174,.3); }
}

.telegram-icon {
  width: 25px;
  height: 25px;
  fill: currentColor;
}

.private {
  display: flex;
  align-items: center;
  justify-content: center;
