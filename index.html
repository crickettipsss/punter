
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080e17">
  <title>PUNTER KA TOSS | Telegram Channel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px 14px;
      font-family: Arial, Helvetica, sans-serif;
      color: #edf4ff;
      background:
        radial-gradient(ellipse at 5% 5%, #21120d 0%, transparent 45%),
        radial-gradient(ellipse at 95% 95%, #00232c 0%, transparent 45%),
        #05080e;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px 24px 28px;
      text-align: center;
      background: linear-gradient(145deg, #0b111b, #080e17);
      border: 1px solid #263442;
      border-radius: 34px;
      box-shadow: 0 0 28px rgba(0, 191, 255, 0.06);
    }

    .logo-ring {
      width: 142px;
      height: 142px;
      padding: 5px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffbf9b, #00c8ff 70%);
      box-shadow: 0 0 22px rgba(0, 195, 255, 0.22);
    }

    .logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #09111b;
    }

    .channel-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 17px;
      margin-bottom: 28px;
      color: #00d9ff;
      background: rgba(0, 195, 230, 0.09);
      border: 1px solid #006c83;
      border-radius: 30px;
      font-size: 15px;
    }

    .check {
      width: 19px;
      height: 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #00d9ff;
      border-radius: 50%;
      font-size: 12px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(23px, 6vw, 31px);
      line-height: 1.3;
      font-weight: 800;
      overflow-wrap: anywhere;
      margin-bottom: 9px;
    }

    .fire {
      font-size: 30px;
      margin-bottom: 23px;
    }

    .description {
      max-width: 340px;
      margin: 0 auto 30px;
      color: #a8b2c0;
      font-size: 17px;
      line-height: 1.8;
    }

    .join-btn {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 12px;
      color: white;
      text-decoration: none;
      font-size: 19px;
      font-weight: 600;
      background: linear-gradient(100deg, #079fe8, #08c1f4);
      border-radius: 22px;
      box-shadow: 0 9px 28px rgba(0, 176, 255, 0.20);
      transition: transform 0.2s ease;
    }

    .join-btn:active {
      transform: scale(0.98);
    }

    .telegram-icon {
      width: 25px;
      height: 25px;
      flex-shrink: 0;
    }

    .hint {
      color: #7d8999;
      font-size: 14px;
      line-height: 1.6;
      margin-top: 23px;
    }

    .divider {
      height: 1px;
      background: #202b37;
      margin: 38px 0 24px;
    }

    .footer {
      color: #788493;
      font-size: 12px;
      line-height: 1.7;
    }

    .ads {
      display: inline-block;
      margin-top: 12px;
      color: #8d9baa;
      font-size: 11px;
      text-decoration: none;
    }

    .ads span {
      color: #00c9f5;
      font-weight: 600;
    }

    @media (max-width: 380px) {
      .card {
        padding: 28px 18px 23px;
        border-radius: 27px;
      }

      .logo-ring {
        width: 122px;
        height: 122px;
        margin-bottom: 23px;
      }

      .channel-label {
        margin-bottom: 22px;
        font-size: 14px;
      }

      .description {
        font-size: 15px;
        margin-bottom: 24px;
      }

      .join-btn {
        min-height: 57px;
        font-size: 17px;
        border-radius: 18px;
      }

      .divider {
        margin: 29px 0 20px;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="logo-ring">
      <img
        class="logo"
        src="logo.jpg"
        alt="PUNTER KA TOSS logo"
      >
    </div>

    <div class="channel-label">
      <span class="check">✓</span>
      Cricket Updates Channel
    </div>

    <h1>PUNTER KA TOSS</h1>
    <div class="fire" aria-hidden="true">🔥</div>

    <p class="description">
      Exclusive cricket insights, match analysis, and
      live updates shared inside our Telegram channel.
    </p>

    <a
      class="join-btn"
      href="https://t.me/+MBzw7mPfMgQ4NjU1"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg class="telegram-icon"
           viewBox="0 0 24 24"
           fill="none"
           aria-hidden="true">
        <path
          d="M21 3 3.8 9.65c-1.18.47-1.17 1.12-.22 1.42l4.42 1.38 1.7 5.22c.21.57.11.8.71.8.47 0 .68-.21.94-.47l2.14-2.08 4.46 3.3c.82.45 1.41.22 1.62-.76L22.5 4.2C22.81 2.99 22.1 2.45 21 3ZM9.04 12.14l9.62-6.07c.48-.29.92-.13.56.19l-7.95 7.18-.31 3.35-1.92-4.65Z"
          fill="currentColor"/>
      </svg>
      Join on Telegram
    </a>

    <p class="hint">Click above to access the channel</p>

    <div class="divider"></div>

    <footer class="footer">
      © 2026 PUNTER KA TOSS · Independent cricket channel
      <br>
      <a
        class="ads"
        href="https://t.me/+4I3Ss-TD1hI5NGE1"
        target="_blank"
        rel="noopener noreferrer"
      >Ads By <span>@PrinceAds9xz</span></a>
    </footer>

  </main>
</body>
</html>
